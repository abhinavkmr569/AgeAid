services:
  db:
    image: postgres:15
    container_name: health-db
    restart: always
    environment:
      POSTGRES_USER: healthuser
      # Read from .env (gitignored). Must match the password in DATABASE_URL.
      # Compose refuses to start if it is unset, rather than falling back.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: healthdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: health-app
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8502:8502"
      - "8501:8501"

volumes:
  postgres_data: